[platformio]
src_dir = tests/arduino
default_envs = esp32s3-quick, mega-quick

[env]
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    symlink://.
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit BusIO@^1.17.4

[esp32s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1

[mega]
platform = atmelavr@5.3.0
board = megaatmega2560

[env:esp32s3-quick]
extends = esp32s3
build_flags = -DINDURUI_EXAMPLE=1

[env:esp32s3-two]
extends = esp32s3
build_flags = -DINDURUI_EXAMPLE=2

[env:esp32s3-persistent]
extends = esp32s3
build_flags = -DINDURUI_EXAMPLE=3

[env:esp32s3-dashboard]
extends = esp32s3
build_flags = -DINDURUI_EXAMPLE=4

[env:esp32s3-icons]
extends = esp32s3
build_flags = -DINDURUI_EXAMPLE=5

[env:mega-quick]
extends = mega
build_flags = -DINDURUI_EXAMPLE=1

[env:mega-two]
extends = mega
build_flags = -DINDURUI_EXAMPLE=2

[env:mega-persistent]
extends = mega
build_flags = -DINDURUI_EXAMPLE=3

[env:mega-dashboard]
extends = mega
build_flags = -DINDURUI_EXAMPLE=4

[env:mega-icons]
extends = mega
build_flags = -DINDURUI_EXAMPLE=5

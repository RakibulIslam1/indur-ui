name: Bitmap Studio website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "tests/test_bitmap.mjs"
      - "tests/test_website.cjs"
      - "tests/test_oled*"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "tests/test_bitmap.mjs"
      - "tests/test_website.cjs"
      - "tests/test_oled*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Bitmap format and image processing checks
        run: node --test tests/test_bitmap.mjs tests/test_oled.mjs
      - name: Install browser test tools
        run: |
          npm install --prefix .build/web-tools --no-save playwright@1.64.1
          .build/web-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Desktop, mobile and export checks
        run: node tests/test_website.cjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

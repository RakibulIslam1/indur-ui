name: Build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Export a clean library package
        run: |
          mkdir -p .build
          git archive --format=tar --prefix=IndurUI/ HEAD | tar -xf - -C .build
      - name: Select checks for the current Library Manager status
        id: lint-mode
        run: |
          python3 - <<'PY'
          import gzip, json, os, urllib.request
          from pathlib import Path
          properties = dict(line.split('=', 1) for line in Path('library.properties').read_text().splitlines() if '=' in line)
          with urllib.request.urlopen('https://downloads.arduino.cc/libraries/library_index.json.gz', timeout=45) as response:
              libraries = json.loads(gzip.decompress(response.read()))['libraries']
          indexed = any(library['name'].lower() == properties['name'].lower() for library in libraries)
          mode = 'update' if indexed else 'submit'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('mode=' + mode + '\n')
          print('Arduino Library Manager lint mode: ' + mode)
          PY
      - uses: arduino/arduino-lint-action@v3.0.0
        with:
          path: .build/IndurUI
          version: 1.3.0
          compliance: specification
          library-manager: ${{ steps.lint-mode.outputs.mode }}
          project-type: library
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Native UI and storage behavior
        run: |
          mkdir -p .build
          g++ -std=c++11 -Wall -Wextra -pedantic -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc -Itests/fakes tests/test_core.cpp src/IndurUI.cpp -o .build/test_core
          .build/test_core
      - name: Converter and desktop export
        run: |
          python -m pip install -r tools/requirements.txt
          python -m unittest discover -s tests -p 'test_converter.py' -v
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb xauth
          xvfb-run -a python tests/check_gui.py
      - name: Check out the unmodified Adafruit GFX renderer
        uses: actions/checkout@v7
        with:
          repository: adafruit/Adafruit-GFX-Library
          ref: ac6d7c3869a693d406f77b9bfcd486b0673169f0
          path: .build/adafruit-gfx
      - name: Reproduce exact OLED framebuffer captures
        run: python tools/render_oled.py --gfx-dir .build/adafruit-gfx --check

  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32s3, mega]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install platformio==6.2.0
      - name: Compile all six generic examples, including SH1106
        run: >-
          pio run
          -e ${{ matrix.board }}-quick
          -e ${{ matrix.board }}-two
          -e ${{ matrix.board }}-persistent
          -e ${{ matrix.board }}-dashboard
          -e ${{ matrix.board }}-icons
          -e ${{ matrix.board }}-sh1106
      - name: Reject small AVR targets and accept the Mega memory baseline
        if: matrix.board == 'mega'
        run: python tests/check_boards.py
      - name: Compile both mini robot button counts with SSD1306 and SH1106
        if: matrix.board == 'esp32s3'
        run: pio run -e mini_ui_test -e mini_ui_test_2buttons -e mini_ui_test_sh1106 -e mini_ui_test_sh1106_2buttons
